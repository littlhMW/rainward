<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a1d">
  <meta name="description" content="雨间 Rainward：不剧透的雨世界新手向导。用区域连接和逐级提示寻找故事，保留第一次探索的惊喜。">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/style.css">
  <title>雨间 Rainward · 把发现留给你</title>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="header">
    <a class="brand" href="./" aria-label="雨间首页"><img src="./icon.svg" width="37" height="37" alt=""><span>雨间<small>RAINWARD</small></span></a>
    <nav class="nav" aria-label="主导航">
      <button class="nav-item active" data-page="explore">探索导航</button>
      <button class="nav-item" data-page="guide">生存手册</button>
      <button class="nav-item" data-page="journal">旅途笔记</button>
    </nav>
    <div class="header-end"><span class="local-status"><i></i><span id="save-status">进度仅存本机</span></span><button class="icon-button" id="settings-button" aria-label="关于与设置" title="关于与设置">⚙</button></div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="footer"><span>雨会停，探索不必着急。<span class="footer-dot">·</span>一份给初来者的野外手册</span><button id="sources-button">资料来源与项目说明 <span aria-hidden="true">↗</span></button></footer>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">这份互动向导需要 JavaScript。你也可以直接查看 <a href="https://rain-world-map.github.io/">Rain World Map</a>（外站含剧透）。</p></noscript>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
